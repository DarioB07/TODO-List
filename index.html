<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tareas por Grupos</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container py-5">
    <div class="row">
      
      <!-- Grupo Casa -->
      <div class="col-md-6 mb-4">
        <div class="card shadow p-3">
          <h4 class="text-center">🏡 House Work</h4>
          <p class="text-center">Progress: <span id="progressCasa">0%</span></p>
          <div class="progress mb-3">
            <div id="barCasa" class="progress-bar bg-success" style="width: 0%"></div>
          </div>

          <div id="listaCasa"><!-- Lista vacía --></div>

          <div class="input-group mt-3">
            <input type="text" id="nuevaCasa" class="form-control" placeholder="New task...">
            <button class="btn-primary" onclick="agregarTarea('Casa')">+</button>
          </div>
          <button class="reset-btn" onclick="resetTareas('Casa')">Reset</button>
        </div>
      </div>

      <!-- Grupo Casa -->
      <div class="col-md-6 mb-4">
        <div class="card shadow p-3">
          <h4 class="text-center">💻 Job Work</h4>
          <p class="text-center">Progress: <span id="progressCasa">0%</span></p>
          <div class="progress mb-3">
            <div id="barCasa" class="progress-bar bg-success" style="width: 0%"></div>
          </div>

          <div id="listaCasa"><!-- Lista vacía --></div>

          <div class="input-group mt-3">
            <input type="text" id="nuevaCasa" class="form-control" placeholder="New task...">
            <button class="btn-primary" onclick="agregarTarea('Casa')">+</button>
          </div>
          <button class="reset-btn" onclick="resetTareas('Casa')">Reset</button>
        </div>
      </div>

      <!-- Grupo Casa -->
      <div class="col-md-6 mb-4">
        <div class="card shadow p-3">
          <h4 class="text-center">🥳 Dj Work</h4>
          <p class="text-center">Progress: <span id="progressCasa">0%</span></p>
          <div class="progress mb-3">
            <div id="barCasa" class="progress-bar bg-success" style="width: 0%"></div>
          </div>

          <div id="listaCasa"><!-- Lista vacía --></div>

          <div class="input-group mt-3">
            <input type="text" id="nuevaCasa" class="form-control" placeholder="New task...">
            <button class="btn-primary" onclick="agregarTarea('Casa')">+</button>
          </div>
          <button class="reset-btn" onclick="resetTareas('Casa')">Reset</button>
        </div>
      </div>

      <!-- Grupo Trabajo -->
      <div class="col-md-6 mb-4">
        <div class="card shadow p-3">
          <h4 class="text-center">🚶🏼‍♂️ Ejercicio</h4>
          <p class="text-center">Progress: <span id="progressTrabajo">0%</span></p>
          <div class="progress mb-3">
          <div id="barTrabajo" class="progress-bar bg-info" style="width: 0%"></div>
      </div>

          <div id="listaTrabajo"><!-- Lista vacía --></div>

          <div class="input-group mt-3">
            <input type="text" id="nuevaTrabajo" class="form-control" placeholder="New task...">
            <button class="btn-primario" onclick="agregarTarea('Trabajo')">+</button>
          </div>
          <button class="reset-button" onclick="resetTareas('Trabajo')">Reset</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./main.js"></script>
</body>
</html>
